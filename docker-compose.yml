# =============================================================================
# Docker Compose - TechFiling Copilot
# =============================================================================
# Backend config comes from the same .env used for local runs
# (src/config/settings.py holds the defaults). The container always runs in
# Hugging Face API mode: the image has no torch/CUDA, so local mode cannot work.
#
# Auth: the browser talks only to the frontend. The frontend's server-side
# proxy calls the backend over the Docker network and adds API_ACCESS_KEY, so
# the key never reaches the browser. Set API_ACCESS_KEY in .env (required when
# ENVIRONMENT=prod; Compose substitutes it into the frontend below).
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      args:
        # false = no data/ in the image (VECTOR_STORE=qdrant keeps index and filing catalog in Qdrant)
        INCLUDE_DATA: ${INCLUDE_DATA:-true}
    env_file: .env
    environment:
      MODEL_EXECUTION_MODE: huggingface_api
      # Clear any per-stage "local" overrides from .env
      EMBEDDING_EXECUTION_MODE: ""
      RERANKER_EXECUTION_MODE: ""
      GENERATION_EXECUTION_MODE: ""
      # Absolute path inside the writable, mounted logs volume
      LOG_FILE: /app/src/logs/app.log
      # Redis for rate limiting (production)
      RATE_LIMIT_REDIS_URL: redis://redis:6379/0
      # Qdrant over the Docker network (used when VECTOR_STORE=qdrant)
      QDRANT_URL: http://qdrant:6333
      # Supabase JWT secret for authentication
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
    ports:
      # Loopback only: for local debugging. Remove in production so only the frontend is exposed.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src/logs:/app/src/logs
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      # Inlined into the browser bundle at build time; rebuild the frontend after changing them
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    environment:
      BACKEND_URL: http://backend:8000
      API_ACCESS_KEY: ${API_ACCESS_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
