[project]
name = "techfiling-copilot"
version = "0.1.0"
description = "SEC 10-K Document Q&A with RAG - Research assistant for equity analysts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "openai>=1.50.0",
    "pandas>=3.0.6",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    # API dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "bm25s>=0.3.13",
    "deepeval==4.2.8",
    "huggingface-hub>=1.16.1",
    "httpx>=0.28.1",
    # Rate limiting
    "slowapi>=0.1.9",
    "redis>=5.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",  # Required for FastAPI TestClient
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.per-file-ignores]
"api/dependencies.py" = ["E402"]
"api/routers/health.py" = ["E402"]
"api/services/rag_service.py" = ["E402"]
"eval/deepEval/full_pipeline_eval.py" = ["E402"]
"eval/deepEval/generator_eval.py" = ["E402"]
"eval/deepEval/retriever_eval.py" = ["E402"]
"eval/generation_eval.py" = ["E402"]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
 
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA build on Windows (local GPU dev), CPU build on Linux (Docker image)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
